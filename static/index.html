<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Genius Parser</title>
<style>
  :root { --bg:#18181b; --panel:#1f1f23; --line:#2f2f35; --text:#fafafa; --muted:#a1a1aa; --hover:#27272c; --ok:#86efac; --err:#fca5a5; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 Inter,-apple-system,"Segoe UI",system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  a { color:inherit; }
  .wrap { max-width:1240px; margin:0 auto; padding:0 24px; }
  header { border-bottom:1px solid var(--line); background:var(--bg); position:sticky; top:0; z-index:2; }
  header .wrap { display:flex; gap:20px; align-items:center; height:56px; }
  header h1 { font-size:15px; font-weight:600; margin:0; white-space:nowrap; }
  header h1 a { text-decoration:none; } header h1 span { color:var(--muted); font-weight:400; }
  form.search { flex:1; display:flex; gap:8px; max-width:560px; margin-left:auto; }
  input[type=text], input[type=search], input[type=number] { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 12px; font:inherit; min-width:0; }
  input::placeholder { color:var(--muted); }
  input:focus { outline:none; border-color:var(--muted); }
  form.search input { flex:1; }
  button { background:var(--text); color:var(--bg); border:0; border-radius:8px; padding:7px 14px; font:inherit; font-weight:500; cursor:pointer; transition:opacity .15s; }
  button:hover { opacity:.85; } button:disabled { opacity:.5; cursor:default; }
  button.ghost { background:var(--bg); color:var(--text); border:1px solid var(--line); padding:4px 10px; font-size:13px; }
  button.ghost:hover { border-color:var(--muted); opacity:1; }
  main { padding-top:24px; padding-bottom:64px; }
  section + section { margin-top:32px; }
  h2 { font-size:13px; font-weight:500; color:var(--muted); margin:0 0 12px; text-transform:uppercase; letter-spacing:.04em; display:flex; gap:12px; align-items:center; }
  h2 .sub { text-transform:none; letter-spacing:0; }
  h2 .grow { flex:1; } h2 .tools { display:flex; gap:10px; align-items:center; text-transform:none; letter-spacing:0; font-weight:400; }
  .status { color:var(--muted); padding:32px 0; text-align:center; }
  .grid { list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:8px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .grid.wide { grid-template-columns:repeat(auto-fill,minmax(420px,1fr)); }
  .actions { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .name.wrap { white-space:normal; overflow:visible; }
  .card.hover:hover { background:var(--hover); }
  .row { display:flex; align-items:center; gap:12px; }
  .card img.av { width:36px; height:36px; border-radius:6px; object-fit:cover; background:var(--line); flex:none; }
  .grow { flex:1; min-width:0; }
  .name { font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .name a { text-decoration:none; } .name a:hover { text-decoration:underline; text-underline-offset:3px; }
  .sub { color:var(--muted); font-size:12px; }
  .badge { font:12px ui-monospace,SFMono-Regular,monospace; color:var(--muted); background:var(--bg); border:1px solid var(--line); padding:1px 7px; border-radius:6px; cursor:pointer; white-space:nowrap; }
  .badge:hover { color:var(--text); border-color:var(--muted); }
  .badge.group { font-family:inherit; cursor:default; color:var(--text); }
  .opts { display:flex; gap:12px; align-items:center; margin-top:10px; padding-top:10px; border-top:1px solid var(--line); flex-wrap:wrap; color:var(--muted); }
  .opts input[type=number] { width:90px; }
  .bar { height:4px; background:var(--line); border-radius:2px; overflow:hidden; margin:8px 0 4px; }
  .bar > div { height:100%; background:var(--text); transition:width .3s; }
  .chip { font-size:12px; padding:1px 8px; border-radius:99px; border:1px solid var(--line); color:var(--muted); }
  .chip.done { color:var(--ok); } .chip.failed { color:var(--err); } .chip.running { color:var(--text); }
  details summary { cursor:pointer; color:var(--muted); font-size:12px; }
  pre.log { margin:6px 0 0; font:12px/1.5 ui-monospace,monospace; color:var(--muted); white-space:pre-wrap; max-height:160px; overflow:auto; }
  .hero { display:flex; gap:20px; align-items:flex-start; margin-bottom:24px; }
  .hero img { width:140px; height:140px; border-radius:10px; object-fit:cover; background:var(--line); flex:none; }
  .hero h1 { margin:0 0 4px; font-size:24px; letter-spacing:-.01em; }
  .hero p { margin:8px 0 0; color:var(--muted); max-width:760px; white-space:pre-wrap; }
  .links { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .album { display:flex; flex-direction:column; gap:8px; text-decoration:none; }
  .album img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:6px; background:var(--line); }
  table { width:100%; border-collapse:collapse; }
  td, th { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; font-size:12px; }
  td.num { color:var(--muted); width:48px; font-variant-numeric:tabular-nums; }
  .roles { margin-top:6px; display:grid; grid-template-columns:110px 1fr; gap:2px 12px; font-size:12px; color:var(--muted); }
  .back { color:var(--muted); text-decoration:none; display:inline-block; margin-bottom:16px; } .back:hover { color:var(--text); }
  .status:empty { display:none; }
  [hidden] { display:none !important; }
  @media (max-width:640px) { header .wrap { height:auto; flex-wrap:wrap; padding-top:10px; padding-bottom:10px; gap:10px; } form.search { flex-basis:100%; max-width:none; } .hero { flex-direction:column; } }
</style>
</head>
<body>
<header><div class="wrap">
  <h1><a href="#/">Genius <span>/ Parser</span></a></h1>
  <form class="search" id="search">
    <input id="q" type="search" placeholder="Имя артиста или его id…" autocomplete="off" required>
    <button>Найти</button>
  </form>
</div></header>
<main class="wrap" id="view"></main>

<script>
const $ = id => document.getElementById(id);
const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids.flat(Infinity).filter(Boolean)); return e; };
const view = $('view');

async function api(url, opts) {
  const r = await fetch(url, opts);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.status);
  return r.json();
}
const post = (url, body) => api(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: body === undefined ? undefined : JSON.stringify(body) });

const idBadge = id => { const b = el('span', { className: 'badge', textContent: id, title: 'Копировать id' }); b.onclick = () => navigator.clipboard.writeText(String(id)); return b; };
const avatar = url => el('img', { className: 'av', src: url || '', alt: '', loading: 'lazy' });
const STAGES = { artist: 'Профиль и группы', albums: 'Список альбомов', tracks: 'Альбомы и треки', credits: 'Артисты из кредитов' };
const STAGE_ORDER = Object.keys(STAGES);
const ROLES = { primary: 'Основной', featured: 'Featured', writer: 'Автор', producer: 'Продюсер', performance: '' };

let pollTimer = null;
const stopPolling = () => { clearInterval(pollTimer); pollTimer = null; };

/* ---------- search ---------- */

let searchResults = null; // {title, items} or null

$('search').addEventListener('submit', async e => {
  e.preventDefault();
  const text = $('q').value.trim();
  location.hash = '#/';
  searchResults = { status: 'Ищем…', items: [] };
  renderHome();
  try {
    const items = /^\d+$/.test(text)
      ? [await api('/api/artists/' + text)]
      : await api('/api/search/artists?name=' + encodeURIComponent(text));
    searchResults = { status: items.length ? '' : 'Ничего не найдено', items };
  } catch (err) { searchResults = { status: 'Ошибка: ' + err.message, items: [] }; }
  renderHome();
});

function searchCard(a) {
  const opts = el('div', { className: 'opts', hidden: true });
  const limit = el('input', { type: 'number', min: 1, value: 20, placeholder: 'все' });
  const force = el('input', { type: 'checkbox' });
  const go = el('button', { textContent: 'Запустить' });
  go.onclick = async () => {
    go.disabled = true;
    try {
      await post('/api/discography', { artist_id: a.id, albums_limit: limit.value ? Number(limit.value) : null, force: force.checked });
      opts.hidden = true; refreshJobs();
    } catch (err) { alert(err.message); }
    go.disabled = false;
  };
  opts.append('Альбомов:', limit, el('span', { className: 'sub', textContent: 'пусто = все' }),
    el('label', {}, force, ' обновить заново'), go);

  const profile = el('button', { className: 'ghost', textContent: 'Профиль' });
  profile.onclick = async () => {
    profile.disabled = true; profile.textContent = '…';
    try { await post(`/api/artists/${a.id}/ingest`); profile.textContent = 'Сохранён ✓'; loadLibrary(); }
    catch (err) { profile.textContent = 'Ошибка'; profile.disabled = false; }
  };
  const disco = el('button', { className: 'ghost', textContent: 'Дискография…' });
  disco.onclick = () => { opts.hidden = !opts.hidden; };

  return el('li', { className: 'card' },
    el('div', { className: 'row' }, avatar(a.image_url),
      el('div', { className: 'grow name' }, el('a', { href: a.url, target: '_blank', rel: 'noopener', textContent: a.name })),
      idBadge(a.id)),
    el('div', { className: 'actions' }, profile, disco),
    opts);
}

/* ---------- jobs ---------- */

function jobCard(j) {
  const idx = STAGE_ORDER.indexOf(j.stage);
  const pct = j.total ? Math.round(100 * j.done / j.total) : 0;
  const active = j.status === 'running' || j.status === 'queued';
  const cancel = el('button', { className: 'ghost', textContent: 'Остановить' });
  cancel.onclick = async () => { cancel.disabled = true; await post(`/api/jobs/${j.id}/cancel`); refreshJobs(); };
  const sum = j.summary;
  return el('li', { className: 'card' },
    el('div', { className: 'row' },
      el('div', { className: 'grow name wrap', textContent: `Дискография: ${j.title}` }),
      el('span', { className: 'sub', textContent: j.params.albums_limit ? `${j.params.albums_limit} альбомов` : 'все альбомы' }),
      el('span', { className: 'chip ' + j.status, textContent: { queued: 'в очереди', running: 'идёт', done: 'готово', failed: 'ошибка', cancelled: 'остановлено' }[j.status] }),
      active && cancel),
    active && el('div', {},
      el('div', { className: 'bar' }, el('div', { style: `width:${pct}%` })),
      el('div', { className: 'sub', textContent: `${idx + 1}/4 ${STAGES[j.stage] || ''}${j.total ? ` · ${j.done}/${j.total}` : ''} · ${j.message}` })),
    sum && el('div', { className: 'sub', textContent: `Альбомов: ${sum.albums} · песен: ${sum.songs} · артистов: ${sum.artists}` + (sum.errors ? ` · ошибок: ${sum.errors}` : '') }),
    j.error && el('div', { className: 'sub', style: 'color:var(--err)', textContent: j.error }),
    j.logs.length && el('details', {}, el('summary', { textContent: 'Журнал' }), el('pre', { className: 'log', textContent: j.logs.join('\n') })));
}

async function refreshJobs() {
  const box = $('jobs'); if (!box) return stopPolling();
  try {
    const jobs = await api('/api/jobs');
    $('jobs-section').hidden = !jobs.length;
    box.replaceChildren(...jobs.map(jobCard));
    const active = jobs.some(j => j.status === 'running' || j.status === 'queued');
    if (active && !pollTimer) pollTimer = setInterval(refreshJobs, 1500);
    if (!active && pollTimer) { stopPolling(); loadLibrary(); }
  } catch { /* server restarting */ }
}

/* ---------- library ---------- */

let libTimer;
async function loadLibrary() {
  const box = $('library'); if (!box) return;
  const params = new URLSearchParams({ q: $('lib-q').value.trim(), groups_only: $('lib-groups').checked });
  try {
    const [data, stats] = await Promise.all([api('/api/db/artists?' + params), api('/api/db/stats')]);
    $('lib-stats').textContent = `${stats.artists} артистов · ${stats.groups} групп · ${stats.albums} альбомов · ${stats.songs} песен`;
    $('lib-status').textContent = data.items.length ? '' : 'Пока пусто. Найдите артиста и запустите парсинг.';
    $('lib-status').hidden = data.items.length > 0;
    box.replaceChildren(...data.items.map(a => el('li', { className: 'card hover' },
      el('div', { className: 'row' }, avatar(a.image_url),
        el('div', { className: 'grow' },
          el('div', { className: 'name' }, el('a', { href: '#/artist/' + a.id, textContent: a.name })),
          el('div', { className: 'sub', textContent: a.albums ? `${a.albums} альбомов` : '' })),
        a.is_group && el('span', { className: 'badge group', textContent: 'группа' }), idBadge(a.id)))));
  } catch (err) { $('lib-status').textContent = 'Ошибка: ' + err.message; }
}

function renderHome() {
  stopPolling();
  const lib = el('input', { id: 'lib-q', type: 'search', placeholder: 'Фильтр по имени' });
  const groups = el('input', { id: 'lib-groups', type: 'checkbox' });
  lib.oninput = () => { clearTimeout(libTimer); libTimer = setTimeout(loadLibrary, 250); };
  groups.onchange = loadLibrary;
  view.replaceChildren(
    searchResults && el('section', {},
      el('h2', { textContent: 'Результаты поиска' }),
      el('div', { className: 'status', textContent: searchResults.status, hidden: !searchResults.status }),
      el('ul', { className: 'grid wide' }, searchResults.items.map(searchCard))),
    el('section', { id: 'jobs-section', hidden: true }, el('h2', { textContent: 'Задачи' }), el('ul', { id: 'jobs', className: 'grid wide' })),
    el('section', {},
      el('h2', {}, el('span', { textContent: 'Библиотека' }), el('span', { id: 'lib-stats', className: 'sub' }), el('span', { className: 'grow' }),
        el('span', { className: 'tools' }, lib, el('label', {}, groups, ' только группы'))),
      el('div', { id: 'lib-status', className: 'status' }),
      el('ul', { id: 'library', className: 'grid' })));
  refreshJobs(); loadLibrary();
}

/* ---------- artist page ---------- */

const REL_TITLES = { members: 'Участники', member_of: 'Состоит в' };

async function renderArtist(id) {
  stopPolling();
  view.replaceChildren(el('div', { className: 'status', textContent: 'Загрузка…' }));
  let a;
  try { a = await api('/api/db/artists/' + id); }
  catch { return view.replaceChildren(el('a', { className: 'back', href: '#/', textContent: '← Назад' }), el('div', { className: 'status', textContent: 'Артиста нет в базе. Сначала запустите парсинг.' })); }

  const relBlocks = Object.entries(a.relationships).map(([type, list]) => el('section', {},
    el('h2', { textContent: REL_TITLES[type] || type }),
    el('ul', { className: 'grid' }, list.map(r => el('li', { className: 'card hover' },
      el('div', { className: 'row' }, avatar(r.image_url),
        el('div', { className: 'grow name' }, r.loaded ? el('a', { href: '#/artist/' + r.id, textContent: r.name }) : r.name),
        r.is_group && el('span', { className: 'badge group', textContent: 'группа' }), idBadge(r.id)))))));

  const rerun = el('button', { className: 'ghost', textContent: 'Спарсить дискографию' });
  rerun.onclick = async () => { await post('/api/discography', { artist_id: a.id, albums_limit: 20, force: false }); location.hash = '#/'; };

  view.replaceChildren(
    el('a', { className: 'back', href: '#/', textContent: '← Назад' }),
    el('div', { className: 'hero' }, el('img', { src: a.image_url || '', alt: '' }),
      el('div', {},
        el('h1', { textContent: a.name }),
        el('div', { className: 'sub', textContent: [a.is_group && 'группа', a.is_verified && 'верифицирован', a.followers_count != null && `${a.followers_count} подписчиков`].filter(Boolean).join(' · ') }),
        a.alternate_names.length && el('div', { className: 'sub', textContent: 'Также: ' + a.alternate_names.join(', ') }),
        el('div', { className: 'links' }, idBadge(a.id), a.url && el('a', { className: 'badge', href: a.url, target: '_blank', rel: 'noopener', textContent: 'Genius ↗' }),
          ...Object.entries(a.social).map(([k, v]) => el('span', { className: 'badge', textContent: `${k}: ${v}` })), rerun),
        a.description && el('p', { textContent: a.description }))),
    ...relBlocks,
    el('section', {}, el('h2', { textContent: `Альбомы (${a.albums.length})` }),
      a.albums.length ? el('ul', { className: 'grid' }, a.albums.map(al => el('li', { className: 'card hover' },
        el('a', { className: 'album', href: '#/album/' + al.id },
          el('img', { src: al.cover_art_url || '', alt: '', loading: 'lazy' }),
          el('div', {}, el('div', { className: 'name', textContent: al.name }),
            el('div', { className: 'sub', textContent: [al.date, al.loaded ? `${al.tracks} треков` : 'не загружен'].filter(Boolean).join(' · ') })))))) :
        el('div', { className: 'status', textContent: 'Альбомы ещё не загружены' })));
}

/* ---------- album page ---------- */

function credits(list) {
  const rows = [];
  const byRole = {};
  for (const c of list) (byRole[c.role === 'performance' ? c.detail : c.role] ||= []).push(c);
  for (const [role, people] of Object.entries(byRole))
    rows.push(el('div', { textContent: ROLES[role] || role }), el('div', {}, people.map((p, i) => [i ? ', ' : '', el('a', { href: '#/artist/' + p.id, textContent: p.name })])));
  return el('div', { className: 'roles' }, rows);
}

async function renderAlbum(id) {
  stopPolling();
  view.replaceChildren(el('div', { className: 'status', textContent: 'Загрузка…' }));
  let al;
  try { al = await api('/api/db/albums/' + id); }
  catch { return view.replaceChildren(el('a', { className: 'back', href: '#/', textContent: '← Назад' }), el('div', { className: 'status', textContent: 'Альбома нет в базе' })); }
  const multiDisc = new Set(al.tracks.map(t => t.disc_number)).size > 1;
  view.replaceChildren(
    el('a', { className: 'back', href: al.artists[0] ? '#/artist/' + al.artists[0].id : '#/', textContent: '← ' + (al.artists[0]?.name || 'Назад') }),
    el('div', { className: 'hero' }, el('img', { src: al.cover_art_url || '', alt: '' }),
      el('div', {}, el('h1', { textContent: al.name }),
        el('div', { className: 'sub' }, al.artists.map((a, i) => [i ? ', ' : '', el('a', { href: '#/artist/' + a.id, textContent: a.name })]), al.date && ' · ' + al.date),
        el('div', { className: 'links' }, idBadge(al.id), al.url && el('a', { className: 'badge', href: al.url, target: '_blank', rel: 'noopener', textContent: 'Genius ↗' })))),
    el('table', {},
      el('thead', {}, el('tr', {}, el('th', { textContent: '№' }), el('th', { textContent: 'Трек' }))),
      el('tbody', {}, al.tracks.map(t => el('tr', {},
        el('td', { className: 'num', textContent: (multiDisc ? `${t.disc_number}.` : '') + (t.number ?? '–') }),
        el('td', {},
          el('div', { className: 'row' }, el('div', { className: 'grow' }, el('a', { href: t.url, target: '_blank', rel: 'noopener', textContent: t.title })), idBadge(t.id)),
          t.credits.length ? el('details', {}, el('summary', { textContent: `Участники (${t.credits.length})` }), credits(t.credits))
                           : el('div', { className: 'sub', textContent: t.loaded ? '' : 'не загружен' })))))));
}

/* ---------- router ---------- */

function route() {
  const [, page, id] = location.hash.split('/');
  if (page === 'artist' && id) renderArtist(id);
  else if (page === 'album' && id) renderAlbum(id);
  else renderHome();
  window.scrollTo(0, 0);
}
addEventListener('hashchange', route);
route();
</script>
</body>
</html>
